<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English-French Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .font-display { font-family: 'Fredoka', sans-serif; }
        
        /* 3D Flip Effect */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-container {
            transition: transform 0.6s;
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        
        /* Quiz Button Animation */
        .quiz-btn { transition: all 0.2s; }
        .quiz-btn:active { transform: scale(0.95); }
        .correct-anim { animation: pulseGreen 0.5s; background-color: #86efac !important; border-color: #22c55e !important; color: #14532d !important; }
        .wrong-anim { animation: shake 0.5s; background-color: #fca5a5 !important; border-color: #ef4444 !important; color: #7f1d1d !important; }
        
        /* Modal Animation */
        .modal-enter { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @keyframes pulseGreen {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col items-center p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-2xl flex flex-col gap-4 mb-6">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold text-indigo-900 font-display flex items-center gap-2">
                <span class="text-4xl">🇫🇷</span> Vocab Builder
            </h1>
            <!-- Mode Toggles -->
            <div class="bg-white p-1 rounded-lg shadow-sm flex border border-indigo-100">
                <button onclick="setMode('learn')" id="tab-learn" class="px-4 py-2 rounded-md text-sm font-bold transition bg-indigo-100 text-indigo-700">Learn</button>
                <button onclick="setMode('quiz')" id="tab-quiz" class="px-4 py-2 rounded-md text-sm font-bold transition text-slate-500 hover:bg-slate-50">Quiz</button>
            </div>
        </div>
    </header>

    <!-- Category Selector (Global) -->
    <div class="w-full max-w-2xl mb-6">
        <label class="block text-xs font-bold text-indigo-400 uppercase mb-2 tracking-wider ml-1">Category / Catégorie</label>
        <select id="category-select" onchange="changeCategory()" class="w-full p-4 rounded-xl border-2 border-indigo-100 bg-white text-indigo-900 font-bold focus:border-indigo-500 focus:outline-none shadow-sm text-lg cursor-pointer">
            <!-- Options injected by JS -->
        </select>
    </div>

    <!-- VIEW 1: FLASHCARDS -->
    <main id="view-learn" class="w-full max-w-2xl flex flex-col gap-6">
        
        <!-- Counter -->
        <div class="flex justify-end">
             <div class="bg-white px-4 py-2 rounded-full shadow-sm text-sm font-semibold text-indigo-600 border border-indigo-50">
                Card <span id="current-count">1</span> / <span id="total-count">10</span>
            </div>
        </div>

        <!-- Flashcard Area -->
        <div class="w-full aspect-[4/3] md:aspect-[16/9] perspective-1000 cursor-pointer group" onclick="flipCard()">
            <div id="flashcard" class="card-container transform-style-3d">
                
                <!-- Front (English) -->
                <div class="card-face bg-white border-b-8 border-indigo-500">
                    <div class="absolute top-4 right-4 bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                        English
                    </div>
                    
                    <div class="text-center p-6">
                        <div class="text-6xl mb-4" id="card-icon">📅</div>
                        <h2 id="card-en" class="text-4xl md:text-5xl font-extrabold text-slate-800 font-display mb-2">Monday</h2>
                        
                        <div class="flex justify-center items-center gap-3 mt-4">
                            <button onclick="event.stopPropagation(); speakWord()" class="p-3 rounded-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 transition shadow-sm border border-indigo-100" title="Listen">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                </svg>
                            </button>
                            <button onclick="event.stopPropagation(); toggleSpeed()" id="speed-btn" class="min-w-[3rem] px-2 h-12 rounded-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold text-sm transition shadow-sm border border-indigo-100 flex items-center justify-center" title="Toggle Speed">
                                1x
                            </button>
                        </div>
                    </div>
                    
                    <p class="absolute bottom-6 text-slate-400 text-sm font-semibold animate-bounce">Click to Flip ↻</p>
                </div>

                <!-- Back (French) -->
                <div class="card-face bg-indigo-600 text-white rotate-y-180 border-b-8 border-indigo-800">
                    <div class="absolute top-4 right-4 bg-indigo-500 text-indigo-100 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                        Français
                    </div>
                    
                    <div class="text-center p-6">
                        <div class="text-6xl mb-4 opacity-50 grayscale" id="card-icon-back">📅</div>
                        <h2 id="card-fr" class="text-4xl md:text-5xl font-extrabold font-display">Lundi</h2>
                    </div>
                </div>

            </div>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="prevCard()" class="bg-white hover:bg-slate-50 text-indigo-900 font-bold py-4 rounded-xl shadow-sm border border-indigo-100 transition flex justify-center items-center gap-2 group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:-translate-x-1 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Previous
            </button>
            <button onclick="nextCard()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-md transition flex justify-center items-center gap-2 group">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:translate-x-1 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </main>

    <!-- VIEW 2: QUIZ -->
    <main id="view-quiz" class="w-full max-w-2xl hidden flex-col gap-6">
        
        <!-- Quiz Scoreboard -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100 flex justify-between items-center">
            <div>
                <span class="text-xs font-bold text-slate-400 uppercase">Score</span>
                <div class="text-2xl font-bold text-indigo-900"><span id="quiz-score">0</span></div>
            </div>
            <div class="text-right">
                <button onclick="generateQuizQuestion()" class="text-sm font-bold text-indigo-500 hover:text-indigo-700">Skip Question ➔</button>
            </div>
        </div>

        <!-- Question Card -->
        <div class="bg-white border-b-8 border-indigo-400 rounded-2xl p-8 text-center shadow-lg">
            <p class="text-slate-400 font-bold uppercase text-xs mb-4">What is this in English?</p>
            <div class="text-6xl mb-4" id="quiz-icon">📅</div>
            <h2 id="quiz-question" class="text-4xl font-extrabold text-slate-800 font-display">Lundi</h2>
        </div>

        <!-- Options Grid -->
        <div id="quiz-options" class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <!-- Buttons injected by JS -->
        </div>

        <!-- Feedback / Next Button -->
        <div id="quiz-feedback" class="hidden">
            <button onclick="generateQuizQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition animate-pulse">
                Next Question ➔
            </button>
        </div>

    </main>

    <!-- COMPLETION MODAL -->
    <div id="completion-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl modal-enter">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold text-indigo-900 mb-2">Packet Complete!</h2>
            <p class="text-slate-500 mb-6">You've reviewed all words in this category.</p>
            <div class="flex flex-col gap-3">
                <button onclick="closeModal()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold py-3 rounded-xl transition">
                    Review Again
                </button>
                <button onclick="setMode('quiz'); closeModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                    Take the Quiz
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- VOCABULARY DATA ---
        const vocabData = {
            "Days of the Week": [
                { en: "Monday", fr: "Lundi", icon: "📅" },
                { en: "Tuesday", fr: "Mardi", icon: "📅" },
                { en: "Wednesday", fr: "Mercredi", icon: "📅" },
                { en: "Thursday", fr: "Jeudi", icon: "📅" },
                { en: "Friday", fr: "Vendredi", icon: "🎉" },
                { en: "Saturday", fr: "Samedi", icon: "🛋️" },
                { en: "Sunday", fr: "Dimanche", icon: "☀️" }
            ],
            "Months of the Year": [
                { en: "January", fr: "Janvier", icon: "❄️" },
                { en: "February", fr: "Février", icon: "❤️" },
                { en: "March", fr: "Mars", icon: "☘️" },
                { en: "April", fr: "Avril", icon: "☔" },

                { en: "August", fr: "Août", icon: "🏖️" },
                { en: "September", fr: "Septembre", icon: "🎒" },
                { en: "October", fr: "Octobre", icon: "🎃" },
                { en: "November", fr: "Novembre", icon: "🦃" },
                { en: "December", fr: "Décembre", icon: "🎄" }
            ],
            "Colors": [
                { en: "Red", fr: "Rouge", icon: "🔴" },
                { en: "Blue", fr: "Bleu", icon: "🔵" },
                { en: "Green", fr: "Vert", icon: "🟢" },
                { en: "Yellow", fr: "Jaune", icon: "🟡" },
                { en: "Orange", fr: "Orange", icon: "🟠" },
                { en: "Purple", fr: "Violet", icon: "🟣" },
                { en: "Pink", fr: "Rose", icon: "🌸" },
                { en: "Brown", fr: "Marron", icon: "🟤" },
                { en: "Black", fr: "Noir", icon: "⚫" },
                { en: "White", fr: "Blanc", icon: "⚪" }
            ],
            "Fruits": [
                { en: "Apple", fr: "Pomme", icon: "🍎" },
                { en: "Banana", fr: "Banane", icon: "🍌" },
                { en: "Orange", fr: "Orange", icon: "🍊" },
                { en: "Grapes", fr: "Raisin", icon: "🍇" },
                { en: "Mango", fr: "Mangue", icon: "🥭" },
                { en: "Lemon", fr: "Citron", icon: "🍋" },
                { en: "Pear", fr: "Poire", icon: "🍐" },
                { en: "Peach", fr: "Pêche", icon: "🍑" },
                { en: "Cherry", fr: "Cerise", icon: "🍒" },
                { en: "Kiwi", fr: "Kiwi", icon: "🥝" }
            ],
            "Body Parts": [
                { en: "Head", fr: "Tête", icon: "😊" },
                { en: "Hair", fr: "Cheveux", icon: "💇" },
                { en: "Eye", fr: "Œil", icon: "👁️" },
                { en: "Ear", fr: "Oreille", icon: "👂" },
                { en: "Nose", fr: "Nez", icon: "👃" },
                { en: "Mouth", fr: "Bouche", icon: "👄" },
                { en: "Hand", fr: "Main", icon: "✋" },
                { en: "Leg", fr: "Jambe", icon: "🦵" },
                { en: "Foot", fr: "Pied", icon: "🦶" },
                { en: "Arm", fr: "Bras", icon: "💪" }
            ],
            "Animals": [
                { en: "Cat", fr: "Chat", icon: "🐱" },
                { en: "Dog", fr: "Chien", icon: "🐶" },
                { en: "Cow", fr: "Vache", icon: "🐮" },
                { en: "Lion", fr: "Lion", icon: "🦁" },
                { en: "Tiger", fr: "Tigre", icon: "🐯" },
                { en: "Elephant", fr: "Éléphant", icon: "🐘" },
                { en: "Monkey", fr: "Singe", icon: "🐒" },
                { en: "Rabbit", fr: "Lapin", icon: "🐰" },
                { en: "Bird", fr: "Oiseau", icon: "🐦" },
                { en: "Fish", fr: "Poisson", icon: "🐟" }
            ],
            "Family Members": [
                { en: "Mother", fr: "Mère", icon: "👩" },
                { en: "Father", fr: "Père", icon: "👨" },
                { en: "Brother", fr: "Frère", icon: "👦" },
                { en: "Sister", fr: "Sœur", icon: "👧" },
                { en: "Grandmother", fr: "Grand-mère", icon: "👵" },
                { en: "Grandfather", fr: "Grand-père", icon: "👴" },
                { en: "Uncle", fr: "Oncle", icon: "🧔" },
                { en: "Aunt", fr: "Tante", icon: "👩‍🦰" },
                { en: "Cousin", fr: "Cousin(e)", icon: "🤝" },
                { en: "Baby", fr: "Bébé", icon: "👶" }
            ],
            "Clothes": [
                { en: "Shirt", fr: "Chemise", icon: "👕" },
                { en: "Pants", fr: "Pantalon", icon: "👖" },
                { en: "Dress", fr: "Robe", icon: "👗" },
                { en: "Skirt", fr: "Jupe", icon: "🩰" },
                { en: "Shoes", fr: "Chaussures", icon: "👞" },
                { en: "Socks", fr: "Chaussettes", icon: "🧦" },
                { en: "Hat", fr: "Chapeau", icon: "🧢" },
                { en: "Jacket", fr: "Veste", icon: "🧥" },
                { en: "Coat", fr: "Manteau", icon: "🧥" },
                { en: "Scarf", fr: "Écharpe", icon: "🧣" }
            ],
            "Classroom Objects": [
                { en: "Pen", fr: "Stylo", icon: "🖊️" },
                { en: "Pencil", fr: "Crayon", icon: "✏️" },
                { en: "Book", fr: "Livre", icon: "📖" },
                { en: "Notebook", fr: "Cahier", icon: "📓" },
                { en: "Chair", fr: "Chaise", icon: "🪑" },
                { en: "Table", fr: "Table", icon: "🔲" },
                { en: "Eraser", fr: "Gomme", icon: "🧼" },
                { en: "Bag", fr: "Sac", icon: "🎒" },
                { en: "Ruler", fr: "Règle", icon: "📏" },
                { en: "Marker", fr: "Marqueur", icon: "🖍️" }
            ],
            "Food Items": [
                { en: "Bread", fr: "Pain", icon: "🍞" },
                { en: "Rice", fr: "Riz", icon: "🍚" },
                { en: "Milk", fr: "Lait", icon: "🥛" },
                { en: "Egg", fr: "Œuf", icon: "🥚" },
                { en: "Cheese", fr: "Fromage", icon: "🧀" },
                { en: "Water", fr: "Eau", icon: "💧" },
                { en: "Meat", fr: "Viande", icon: "🥩" },
                { en: "Fish", fr: "Poisson", icon: "🐟" },
                { en: "Apple", fr: "Pomme", icon: "🍎" },
                { en: "Banana", fr: "Banane", icon: "🍌" }
            ]
        };

        // --- APP STATE ---
        let currentCategory = "Days of the Week";
        let currentIndex = 0;
        let isFlipped = false;
        let speechRate = 1.0;
        let currentMode = 'learn'; // 'learn' or 'quiz'
        let quizScore = 0;
        let currentQuizTarget = null;
        let isQuizAnswered = false;

        // --- INITIALIZATION ---
        function init() {
            const select = document.getElementById('category-select');
            Object.keys(vocabData).forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.text = cat;
                select.appendChild(option);
            });
            
            updateCard();
            generateQuizQuestion();
        }

        // --- NAVIGATION ---
        function setMode(mode) {
            currentMode = mode;
            const learnView = document.getElementById('view-learn');
            const quizView = document.getElementById('view-quiz');
            const tabLearn = document.getElementById('tab-learn');
            const tabQuiz = document.getElementById('tab-quiz');

            if(mode === 'learn') {
                learnView.classList.remove('hidden');
                quizView.classList.add('hidden');
                tabLearn.className = "px-4 py-2 rounded-md text-sm font-bold transition bg-indigo-100 text-indigo-700";
                tabQuiz.className = "px-4 py-2 rounded-md text-sm font-bold transition text-slate-500 hover:bg-slate-50";
            } else {
                learnView.classList.add('hidden');
                quizView.classList.remove('hidden');
                quizView.classList.add('flex');
                tabLearn.className = "px-4 py-2 rounded-md text-sm font-bold transition text-slate-500 hover:bg-slate-50";
                tabQuiz.className = "px-4 py-2 rounded-md text-sm font-bold transition bg-indigo-100 text-indigo-700";
            }
        }

        function changeCategory() {
            const select = document.getElementById('category-select');
            currentCategory = select.value;
            
            // Learn Mode Reset
            currentIndex = 0;
            if(isFlipped) flipCard();
            setTimeout(updateCard, isFlipped ? 300 : 0);
            
            // Quiz Mode Reset
            generateQuizQuestion();
        }

        // --- FLASHCARD LOGIC ---
        function updateCard() {
            const list = vocabData[currentCategory];
            const item = list[currentIndex];
            
            document.getElementById('card-en').innerText = item.en;
            document.getElementById('card-fr').innerText = item.fr;
            document.getElementById('card-icon').innerText = item.icon;
            document.getElementById('card-icon-back').innerText = item.icon;
            
            document.getElementById('current-count').innerText = currentIndex + 1;
            document.getElementById('total-count').innerText = list.length;
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            if(isFlipped) {
                card.classList.add('rotate-y-180');
            } else {
                card.classList.remove('rotate-y-180');
            }
        }

        function nextCard() {
            const list = vocabData[currentCategory];
            
            // Check if we are at the end
            if (currentIndex === list.length - 1) {
                if(isFlipped) flipCard();
                document.getElementById('completion-modal').classList.remove('hidden');
                currentIndex = 0; // Reset for background
                setTimeout(updateCard, 300);
                return;
            }

            if(isFlipped) flipCard(); // Flip back first
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % list.length;
                updateCard();
            }, 300);
        }

        function prevCard() {
            const list = vocabData[currentCategory];
            if(isFlipped) flipCard(); // Flip back first
            setTimeout(() => {
                currentIndex = (currentIndex - 1 + list.length) % list.length;
                updateCard();
            }, 300);
        }

        function closeModal() {
            document.getElementById('completion-modal').classList.add('hidden');
        }

        function speakWord() {
            const word = document.getElementById('card-en').innerText;
            speakText(word);
        }
        
        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = speechRate;
            window.speechSynthesis.speak(utterance);
        }

        function toggleSpeed() {
            const btn = document.getElementById('speed-btn');
            if (speechRate === 1.0) {
                speechRate = 0.5;
                btn.innerText = "0.5x";
                btn.className = "min-w-[3rem] px-2 h-12 rounded-full bg-indigo-200 hover:bg-indigo-300 text-indigo-800 font-bold text-sm transition shadow-sm border border-indigo-300 flex items-center justify-center";
            } else if (speechRate === 0.5) {
                speechRate = 0.25;
                btn.innerText = "0.25x";
                btn.className = "min-w-[3rem] px-2 h-12 rounded-full bg-indigo-300 hover:bg-indigo-400 text-indigo-900 font-bold text-sm transition shadow-sm border border-indigo-400 flex items-center justify-center";
            } else {
                speechRate = 1.0;
                btn.innerText = "1x";
                btn.className = "min-w-[3rem] px-2 h-12 rounded-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold text-sm transition shadow-sm border border-indigo-100 flex items-center justify-center";
            }
        }

        // --- QUIZ LOGIC ---
        function generateQuizQuestion() {
            isQuizAnswered = false;
            document.getElementById('quiz-feedback').classList.add('hidden');
            
            const list = vocabData[currentCategory];
            
            // 1. Pick Correct Answer (Avoid immediate repeat)
            let newTarget;
            do {
                newTarget = list[Math.floor(Math.random() * list.length)];
            } while (list.length > 1 && currentQuizTarget && newTarget.en === currentQuizTarget.en);
            
            currentQuizTarget = newTarget;
            
            // 2. Pick Distractors
            let options = [currentQuizTarget];
            while(options.length < 4 && options.length < list.length) {
                const r = list[Math.floor(Math.random() * list.length)];
                if(!options.includes(r)) options.push(r);
            }
            
            // 3. Shuffle Options
            options.sort(() => Math.random() - 0.5);
            
            // 4. Render
            document.getElementById('quiz-icon').innerText = currentQuizTarget.icon;
            document.getElementById('quiz-question').innerText = currentQuizTarget.fr; // Show French
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "quiz-btn bg-white border-2 border-slate-200 p-4 rounded-xl text-lg font-bold text-slate-700 hover:bg-slate-50 hover:border-indigo-300 shadow-sm";
                btn.innerText = opt.en;
                btn.onclick = () => checkQuizAnswer(btn, opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkQuizAnswer(btnElement, selection) {
            if(isQuizAnswered) return;
            isQuizAnswered = true;
            
            const isCorrect = selection.en === currentQuizTarget.en;
            
            if(isCorrect) {
                btnElement.classList.add('correct-anim');
                quizScore += 10;
                document.getElementById('quiz-score').innerText = quizScore;
                speakText(selection.en); // Pronounce correct answer
            } else {
                btnElement.classList.add('wrong-anim');
                
                // Highlight correct one
                const buttons = document.getElementById('quiz-options').children;
                for(let btn of buttons) {
                    if(btn.innerText === currentQuizTarget.en) {
                         btn.classList.add('correct-anim');
                    }
                }
            }
            
            document.getElementById('quiz-feedback').classList.remove('hidden');
        }

        // Run
        init();

    </script>
</body>
</html>
